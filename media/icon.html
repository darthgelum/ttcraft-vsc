<!doctype html>
<meta charset="utf-8">
<title>TTCraft VSC marketplace tile</title>
<!--
  Source of media/icon.png: the TTCraft mark (public/img/TTlogo.svg in the site repo)
  on a patch of the landing hero sky, under the same base-colour fade the landing
  paints over the photo. The photo is read from the sibling checkout of the site.

  Render with headless Edge (or Chrome) from the repo root:

    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new `
      --disable-gpu --hide-scrollbars --window-size=128,128 `
      --default-background-color=00000000 --user-data-dir=$env:TEMP\ttcraft-icon `
      --screenshot=media\icon.png file:///$PWD/media/icon.html
-->
<style>
  html, body { margin: 0; background: transparent; }
  #tile {
    position: relative; width: 128px; height: 128px; overflow: hidden;
    border-radius: 26px;
    background-image:
      linear-gradient(rgba(25, 23, 36, 0.66), rgba(25, 23, 36, 0.66)),
      url(../../ttcraft/public/img/landing-hero.jpg);
    background-size: auto, 1001px auto;
    background-position: 0 0, -330px -120px;
    background-repeat: no-repeat;
  }
  #tile svg { position: absolute; left: 26.5px; top: 21.9px; width: 74.9px; height: 84.2px; }
</style>
<div id="tile">
  <svg viewBox="0 0 96 108" xmlns="http://www.w3.org/2000/svg">

    <circle cx="45" cy="31" r="6.5" fill="#c4a7e7"/>
  </svg>
</div>
